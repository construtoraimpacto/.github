name: "🐞 Bug (correção)"
description: Algo que funcionava e parou, ou não funciona como deveria (POP-03 · manutenção corretiva).
title: "[Módulo] "
labels: ["type:bug"]
projects: ["construtoraimpacto/3"]
body:
  - type: markdown
    attributes:
      value: |
        Use este modelo para erros. Solicitações de usuários entram pelo formulário do Asana; aqui fica o registro técnico.
  - type: input
    id: asana
    attributes:
      label: Tarefa do Asana
      description: Link da tarefa de origem (projeto [TI] - Desenvolvimento de Softwares).
      placeholder: https://app.asana.com/...
    validations:
      required: true
  - type: input
    id: solicitante
    attributes:
      label: Solicitante e equipe
      placeholder: "Ex.: Fulano · CEQ"
  - type: textarea
    id: o-que-acontece
    attributes:
      label: O que acontece
      description: Descrição objetiva do erro.
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências
      description: Prints, vídeo, ID do registro, ambiente, navegador ou celular.
  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade (POP-04)
      options:
        - "P1 · Crítica"
        - "P2 · Alta"
        - "P3 · Média"
        - "P4 · Baixa"
    validations:
      required: true
  - type: input
    id: estimativa
    attributes:
      label: Estimativa (pontos)
      placeholder: "1, 2, 3, 5, 8 ou 13"
