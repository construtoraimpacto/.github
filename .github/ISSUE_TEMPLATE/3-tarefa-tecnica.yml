name: "🛠️ Tarefa técnica"
description: Refatoração, atualização de dependências, CI/CD ou infraestrutura (manutenção preventiva ou adaptativa).
title: "[Técnico] "
labels: ["type:tarefa-tecnica"]
projects: ["construtoraimpacto/3"]
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: O que será feito e por quê.
    validations:
      required: true
  - type: textarea
    id: pronto
    attributes:
      label: Como saber que terminou
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: estimativa
    attributes:
      label: Estimativa (pontos)
      placeholder: "1, 2, 3, 5, 8 ou 13"
